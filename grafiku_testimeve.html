<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0e14;--surface:#141720;--surface2:#1c1f2d;--border:rgba(255,255,255,.09);--gold:#f0b429;--gold-dim:rgba(240,180,41,.13);--gold-glow:rgba(240,180,41,.28);--violet:#b69cff;--violet-dim:rgba(182,156,255,.12);--violet-glow:rgba(182,156,255,.32);--text:#eceaf4;--text-dim:#9b98aa;--text-faint:#5a5870}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{max-width:640px;margin:0 auto;padding:14px 12px 36px}
.back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:9px 16px;border-radius:10px;background:rgba(240,180,41,0.13);border:1px solid rgba(240,180,41,0.28);color:#f0b429;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;text-decoration:none;transition:background .15s}
.back-link:hover{background:rgba(240,180,41,0.25)}
.hdr{text-align:center;margin:4px 0 12px}
.hdr h1{font-size:clamp(22px,6vw,30px);font-weight:800;letter-spacing:-.4px}
.hdr p{color:var(--text-dim);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{border-color:var(--violet-glow);background:var(--violet-dim);color:var(--violet)}
.pick{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--violet-glow);background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.pick span{color:var(--violet)}.pick i{font-style:normal;color:var(--text-dim);font-size:13px}
.panel{display:none;margin:-4px 0 10px;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.panel.open{display:block}
.grp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.grp:last-child{margin:0}
.chip{flex:0 0 calc(12.5% - 6px);min-width:56px;padding:9px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--violet);border-color:var(--violet);color:#150f2a}
.tsel{width:100%;padding:12px;border-radius:12px;border:1px solid var(--violet-glow);background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;font-weight:600;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.cnt{flex:1;font-size:13px;color:var(--text-dim)}
.xb{padding:8px 12px;border-radius:10px;border:1px solid var(--gold-glow);background:var(--gold-dim);color:var(--gold);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.xb[hidden]{display:none}.xb:disabled{opacity:.5}
.it{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:5px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:15px}
.it.next{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}
.it.past{opacity:.45}
.it .d{flex:0 0 78px;color:var(--gold);font-weight:700;font-size:14px;white-space:nowrap}
.it .s{flex:1;min-width:0;font-weight:600;line-height:1.2}
.it .s small{display:block;font-weight:600;font-size:11px;color:var(--violet);margin-top:1px}
.it .h{color:var(--text-dim);font-size:13px;white-space:nowrap}
.empty{padding:18px;text-align:center;color:var(--text-dim);background:var(--surface);border:1px dashed var(--border);border-radius:14px}
.dsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.dbtn{flex:0 0 auto;min-width:56px;padding:7px 9px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer;line-height:1.15}
.dbtn b{display:block;font-size:18px}.dbtn small{font-size:11px;color:var(--text-dim)}
.dbtn.on{background:var(--violet);border-color:var(--violet);color:#150f2a}.dbtn.on small{color:#150f2a}
.pdf{display:block;margin-top:14px;padding:12px;text-align:center;border-radius:14px;border:1px solid var(--gold-glow);background:var(--gold-dim);color:var(--gold);font-weight:700;font-size:14px;text-decoration:none}
button.pdf{width:100%;font-family:inherit;cursor:pointer}button.pdf:disabled{opacity:.5;cursor:wait}
.tq{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--violet-glow);background:var(--surface2);color:var(--text);font-family:inherit;font-size:16px;margin-bottom:8px;outline:none}
.tnames{max-height:46vh;overflow-y:auto}
.tn{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:5px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.tn.on{background:var(--violet);border-color:var(--violet);color:#150f2a}
.tnone{padding:12px;text-align:center;color:var(--text-dim);font-size:14px}
.note{margin-top:8px;text-align:center;font-size:11px;color:var(--text-faint)}

<script>
function fitText(c,text,maxW,size,weight,F){
  c.font=weight+' '+size+'px '+F;
  while(c.measureText(text).width>maxW&&size>8){size-=1;c.font=weight+' '+size+'px '+F;}
  return size;
}
function draw(c,m){
  const W=4200,H=2970,M=80,F="'Times New Roman',Times,'Liberation Serif',serif";
  const n=m.classes.length;
  c.textBaseline='middle';if(c.setLineDash)c.setLineDash([]);
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.fillStyle='#000000';c.textAlign='center';
  let ts=fitText(c,m.title,W-2*M,100,'bold',F);c.font='bold '+ts+'px '+F;c.fillText(m.title,W/2,M+50);
  const top=M+130,HD=96,weekW=84,dayW=250,perW=80;
  const R=Math.max(m.total,1),rowH=Math.min((H-M-20-top-HD)/R,120);
  const gx=M+weekW+dayW+perW,colW=(W-M-gx)/n;
  const gridTop=top+HD,gh=R*rowH,gridBot=gridTop+gh,xr=W-M;
  const ctext=(t,cx,cy,maxW,size,wt,col)=>{const s=fitText(c,t,maxW,size,wt,F);c.font=wt+' '+s+'px '+F;c.fillStyle=col||'#000000';c.textAlign='center';c.fillText(t,cx,cy);return s;};
  // koka
  c.fillStyle='#d9d9d9';c.fillRect(M,top,xr-M,HD);
  ctext('Java',M+weekW/2,top+HD/2,weekW-10,38,'bold');
  ctext('Data',M+weekW+dayW/2,top+HD/2,dayW-20,46,'bold');
  ctext('Ora',M+weekW+dayW+perW/2,top+HD/2,perW-8,40,'bold');
  m.classes.forEach((cn,i)=>ctext(cn,gx+i*colW+colW/2,top+HD/2,colW-12,54,'bold'));
  // shirita alternative për ditët (dita çift = e bardhë, dita tek = gri e çelët)
  m.dayInfo.forEach((o,i)=>{if(i%2){c.fillStyle='#ececec';c.fillRect(M+weekW,gridTop+o.r0*rowH,xr-M-weekW,o.rows*rowH);}});
  // qelizat e testeve
  m.classes.forEach((cn,ci)=>{
    const x=gx+ci*colW;
    for(let r=0;r<m.total;r++){
      const g=m.grid[cn][r];if(!g)continue;
      const y=gridTop+r*rowH,h=rowH*g.len;
      c.fillStyle='#cfcfcf';c.fillRect(x,y,colW,h);
      const sz=Math.min(46,h*(g.len>1?0.4:0.62));
      ctext(g.text,x+colW/2,y+h/2,colW-12,sz,'bold');
    }
  });
  // ora
  for(let r=0;r<m.total;r++){ctext(String(m.rowInfo[r].p),M+weekW+dayW+perW/2,gridTop+r*rowH+rowH/2,perW-10,Math.min(44,rowH*.62),'bold');}
  // etiketat e diteve
  m.dayInfo.forEach(o=>{
    const y=gridTop+o.r0*rowH,bh=o.rows*rowH,cx=M+weekW+dayW/2;
    let s=Math.min(40,bh/3.3);
    s=Math.min(fitText(c,o.l1,dayW-24,s,'bold',F),fitText(c,o.l2,dayW-24,s,'bold',F));
    c.font='bold '+s+'px '+F;c.fillStyle='#000000';c.textAlign='center';
    c.fillText(o.l1,cx,y+bh/2-s*.62);c.fillText(o.l2,cx,y+bh/2+s*.62);
  });
  // etiketat e javeve (vertikale)
  m.weeks.forEach(w=>{
    const y=gridTop+w.r0*rowH,bh=w.rows*rowH;
    c.save();c.translate(M+weekW/2,y+bh/2);c.rotate(-Math.PI/2);
    const s=fitText(c,w.label,bh-24,44,'bold',F);c.font='bold '+s+'px '+F;c.fillStyle='#000000';c.textAlign='center';c.fillText(w.label,0,0);
    c.restore();
  });
  // vijat
  const dayStart={},weekStart={};
  m.dayInfo.forEach(o=>{dayStart[o.r0]=1;});m.weeks.forEach(w=>{weekStart[w.r0]=1;});
  const line=(x1,y1,x2,y2,col,w)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();};
  // 1) ndarjet e orëve brenda ditës (të holla por të qarta; nuk kalojnë mes orëve të bashkuara 2-orëshe)
  for(let r=0;r<=R;r++){
    if(r===0||r===R||weekStart[r]||dayStart[r])continue;
    const y=gridTop+r*rowH;
    line(M+weekW+dayW,y,gx,y,'#333333',3.5);
    m.classes.forEach((cn,ci)=>{if(!m.cont[cn][r]){const x0=gx+ci*colW;line(x0,y,x0+colW,y,'#333333',3.5);}});
  }
  // 2) vijat vertikale
  [M+weekW,M+weekW+dayW].forEach(x=>line(x,top,x,gridBot,'#000000',5));
  m.classes.forEach((cn,i)=>{
    if(i===0)return;
    const g=cn.split('-')[0]!==m.classes[i-1].split('-')[0];
    line(gx+i*colW,top,gx+i*colW,gridBot,'#000000',g?9:3);
  });
  [M,gx,xr].forEach(x=>line(x,top,x,gridBot,'#000000',9));
  // 3) ndarjet e ditëve (të trasha) dhe të javëve (më të trasha), vizatohen të fundit që të dalin qartë
  for(let r=0;r<=R;r++){
    const y=gridTop+r*rowH;
    if(r===0||r===R||weekStart[r])line(M,y,xr,y,'#000000',16);
    else if(dayStart[r])line(M+weekW,y,xr,y,'#000000',10);
  }
  line(M,top,xr,top,'#000000',12);
}
class PdfCtx{
  constructor(W,H,PW,PH){this.W=W;this.H=H;this.k=PW/W;this.PW=PW;this.PH=PH;this.real=document.createElement('canvas').getContext('2d');this.out=[];this.path=[];this.stack=[];this.tx=0;this.ty=0;this.rot=0;this._font='';this.fillStyle='#000000';this.strokeStyle='#000000';this.lineWidth=1;this.textAlign='left';this.textBaseline='middle';}
  set font(v){this._font=v;this.real.font=v;}
  get font(){return this._font;}
  measureText(s){return this.real.measureText(s);}
  _col(h){const m=/^#([0-9a-f]{6})$/i.exec(h)||[0,'000000'];const v=parseInt(m[1],16);return [(v>>16&255)/255,(v>>8&255)/255,(v&255)/255].map(x=>x.toFixed(3)).join(' ');}
  _n(v){return (+v).toFixed(2);}
  _X(x){return this._n(x*this.k);}
  _Y(y){return this._n((this.H-y)*this.k);}
  fillRect(x,y,w,h){this.out.push(this._col(this.fillStyle)+' rg '+this._X(x)+' '+this._Y(y+h)+' '+this._n(w*this.k)+' '+this._n(h*this.k)+' re f');}
  strokeRect(x,y,w,h){this.out.push(this._col(this.strokeStyle)+' RG '+this._n(this.lineWidth*this.k)+' w '+this._X(x)+' '+this._Y(y+h)+' '+this._n(w*this.k)+' '+this._n(h*this.k)+' re S');}
  beginPath(){this.path=[];}
  moveTo(x,y){this.path.push(this._X(x)+' '+this._Y(y)+' m');}
  lineTo(x,y){this.path.push(this._X(x)+' '+this._Y(y)+' l');}
  setLineDash(a){this.dash=(a||[]).map(v=>this._n(v*this.k));}
  stroke(){if(!this.path.length)return;const d=this.dash&&this.dash.length?'['+this.dash.join(' ')+'] 0 d ':'[] 0 d ';this.out.push(this._col(this.strokeStyle)+' RG '+this._n(this.lineWidth*this.k)+' w '+d+this.path.join(' ')+' S');}
  save(){this.stack.push([this.tx,this.ty,this.rot]);}
  restore(){const s=this.stack.pop();if(s){this.tx=s[0];this.ty=s[1];this.rot=s[2];}}
  translate(x,y){const c=Math.cos(this.rot),s=Math.sin(this.rot);this.tx+=x*c-y*s;this.ty+=x*s+y*c;}
  rotate(a){this.rot+=a;}
  _enc(s){const m={8211:0x96,8212:0x97,8216:0x91,8217:0x92,8220:0x93,8221:0x94,8226:0x95};let o='';for(const ch of String(s)){let cp=ch.codePointAt(0);if(m[cp])cp=m[cp];else if(cp>255)cp=63;const c=String.fromCharCode(cp);o+=(c==='('||c===')'||c==='\\')?'\\'+c:c;}return o;}
  fillText(txt,x,y){
    const sz=parseFloat((/([\d.]+)px/.exec(this._font)||[0,20])[1]);
    const w=this.real.measureText(txt).width;
    const ox=this.textAlign==='center'?-w/2:this.textAlign==='right'?-w:0,oy=sz*0.34;
    const lx=x+ox,ly=y+oy,c=Math.cos(this.rot),s=Math.sin(this.rot);
    const gx=this.tx+lx*c-ly*s,gy=this.ty+lx*s+ly*c;
    this.out.push('BT '+this._col(this.fillStyle)+' rg /F1 '+this._n(sz*this.k)+' Tf '+[c,-s,s,c].map(v=>v.toFixed(4)).join(' ')+' '+this._X(gx)+' '+this._Y(gy)+' Tm ('+this._enc(txt)+') Tj ET');
  }
  toPdf(){
    const content=this.out.join('\n'),parts=[],offs=[];let len=0;
    const add=s=>{parts.push(s);len+=s.length;};
    add('%PDF-1.4\n');
    const obj=(i,b)=>{offs[i]=len;add(i+' 0 obj\n'+b+'\nendobj\n');};
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
    obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+this.PW+' '+this.PH+'] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>');
    obj(4,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
    obj(5,'<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>');
    const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';
    for(let i=1;i<6;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
    add(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
    const all=parts.join(''),out=new Uint8Array(all.length);
    for(let i=0;i<all.length;i++)out[i]=all.charCodeAt(i)&255;
    return out;
  }
}
</script>

function makeJpg(o,cb){

  if(!ts.length){$('list').innerHTML='<div class="empty">Klasa '+cur+' nuk ka teste në këtë periudhë.</div>';return;}
  var nx=-1;ts.forEach(function(t,i){if(nx<0&&dayObj(t.d).ts>=today)nx=i;});
  $('list').innerHTML=listHtml(ts.map(function(t,i){var d=dayObj(t.d),past=d.ts<today;return {d:d.w3+' '+d.n+' '+d.m.slice(0,3),s:t.s,h:hrs(t.h),next:i===nx,past:past,tag:(i===nx?rel(d.ts):'')};}));
}
$('cbtn').onclick=function(){var p=$('cpanel');p.className=p.className.indexOf('open')>=0?'panel':'panel open';if(p.className.indexOf('open')>=0)drawPanel();drawClass();};
wire($('cjpg'),$('cshr'),function(){
  var ts=classTests();
  return {file:'klasa '+cur,big:'Klasa '+cur,sub:SUBT,rows:ts.map(function(t){var d=dayObj(t.d);return {d:d.w3+' '+d.n+' '+d.m.slice(0,3),s:t.s,h:hrs(t.h)};})};
});

/* ---- Mësuesi ---- */
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function tkey(n){return norm(n).replace(/\s+/g,' ').trim();}
var SRC_MBIEMER_FIRST=false; /* false = në orar emrat janë 'Emër Mbiemër'; vëre true nëse janë 'Mbiemër Emër' */
function sortKey(n){var w=tkey(n).split(' ');if(SRC_MBIEMER_FIRST&&w.length>1)w=w.slice(1).concat(w[0]);return w.join(' ');} /* renditja sipas emrit, pastaj mbiemrit */
function disp(n){var w=n.replace(/\s+/g,' ').trim().split(' ');if(SRC_MBIEMER_FIRST&&w.length>1)w=w.slice(1).concat(w[0]);return nice(w.join(' '));}
var teachers=[],tseen={};
DATA.tests.forEach(function(t){(t.t||[]).forEach(function(n){var k=tkey(n);if(k&&!tseen[k]){tseen[k]=1;teachers.push(n.replace(/\s+/g,' ').trim());}});});
teachers.sort(function(a,b){var x=sortKey(a),y=sortKey(b);return x<y?-1:x>y?1:0;});
var curT=teachers[0],savedT=get('testim_mesues');
if(savedT){teachers.forEach(function(n){if(tkey(n)===tkey(savedT))curT=n;});}
function teachTests(){var k=tkey(curT);return DATA.tests.filter(function(t){return (t.t||[]).some(function(n){return tkey(n)===k;});}).sort(function(a,b){return a.d-b.d||a.h[0]-b.h[0]||(a.c<b.c?-1:1);});}
var tshown=[];
function drawTPanel(){
  var q=norm($('tq').value).split(/\s+/).filter(Boolean);
  tshown=teachers.filter(function(n){var k=tkey(n);return q.every(function(w){return k.indexOf(w)>=0;});});
  $('tnames').innerHTML=tshown.length?tshown.map(function(n,i){return '<button type="button" class="tn'+(n===curT?' on':'')+'" data-i="'+i+'">'+esc(disp(n))+'</button>';}).join(''):'<div class="tnone">Nuk u gjet asnjë mësues me këtë emër.</div>';
  Array.prototype.forEach.call($('tnames').querySelectorAll('.tn'),function(b){b.onclick=function(){curT=tshown[+b.getAttribute('data-i')];set('testim_mesues',curT);$('tpanel').className='panel';drawTeacher();};});
}
$('tq').oninput=drawTPanel;
$('tbtn').onclick=function(){
  var p=$('tpanel'),open=p.className.indexOf('open')>=0;
  if(open){p.className='panel';}
  else{p.className='panel open';$('tq').value='';drawTPanel();try{$('tq').focus();}catch(e){}}
  drawTeacher();
};
function drawTeacher(){
  var open=$('tpanel').className.indexOf('open')>=0;
  $('tbtn').innerHTML='<span>'+esc(disp(curT))+'</span><i>'+(open?'mbyll ▲':'kërko / ndrysho ▼')+'</i>';
  var ts=teachTests();
  $('tcnt').textContent=ts.length?ts.length+(ts.length===1?' test':' teste'):'';
  if(!ts.length){$('tlist').innerHTML='<div class="empty">Ky mësues nuk ka teste në këtë periudhë.</div>';return;}
  var nx=-1;ts.forEach(function(t,i){if(nx<0&&dayObj(t.d).ts>=today)nx=i;});
  $('tlist').innerHTML=listHtml(ts.map(function(t,i){var d=dayObj(t.d),past=d.ts<today;return {d:d.w3+' '+d.n+' '+d.m.slice(0,3),s:t.c+' · '+t.s,h:hrs(t.h),next:i===nx,past:past,tag:(i===nx?rel(d.ts):'')};}));
}
wire($('tjpg'),$('tshr'),function(){
  var ts=teachTests();
  return {file:'mesues '+curT,big:disp(curT),sub:SUBT,rows:ts.map(function(t){var d=dayObj(t.d);return {d:d.w3+' '+d.n+' '+d.m.slice(0,3),s:t.c+' · '+t.s,h:hrs(t.h)};})};
});

/* ---- Sipas ditës ---- */
var curD=0;DATA.dates.forEach(function(x,i){if(dayObj(i).ts<today)curD=Math.min(i+1,DATA.dates.length-1);});
function dayTests(){return DATA.tests.filter(function(t){return t.d===curD;}).sort(function(a,b){return a.c<b.c?-1:a.c>b.c?1:0;});}
function drawDays(){
  $('dsel').innerHTML=DATA.dates.map(function(x,i){var d=dayObj(i);return '<button type="button" class="dbtn'+(i===curD?' on':'')+'" data-i="'+i+'"><b>'+d.n+'</b><small>'+d.w3+'</small></button>';}).join('');
  Array.prototype.forEach.call($('dsel').children,function(b){b.onclick=function(){curD=+b.getAttribute('data-i');drawDays();};});
  var ts=dayTests();$('dcnt').textContent=ts.length+(ts.length===1?' test':' teste');
  $('dlist').innerHTML=listHtml(ts.map(function(t){return {d:t.c,s:t.s,h:hrs(t.h)};}));
}
wire($('djpg'),$('dshr'),function(){
  var d=dayObj(curD);
  return {file:'dita '+d.n+' '+d.m,big:cap(d.w)+' '+d.n+' '+d.m,sub:SUBT,rows:dayTests().map(function(t){return {d:t.c,s:t.s,h:hrs(t.h)};})};
});

function showTab(n){['1','2','3'].forEach(function(k){$('t'+k).className='tab'+(k===n?' on':'');$('v'+k).style.display=k===n?'':'none';});}
$('t1').onclick=function(){showTab('1');};
$('t2').onclick=function(){showTab('2');drawDays();};
$('t3').onclick=function(){showTab('3');drawTeacher();};
if(!teachers.length)$('t3').style.display='none';
$('pdfbtn').onclick=function(){
  var b=this;b.disabled=true;
  try{
    var rec=new PdfCtx(4200,2970,1190.55,841.89);draw(rec,DATA.model);
    var blob=new Blob([rec.toPdf()],{type:'application/pdf'});
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download='grafiku_testimeve.pdf';document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u);},3000);
  }catch(e){alert('PDF-ja nuk u krijua. Provo përsëri.');}
  b.disabled=false;
};
drawClass();
})();
</script>
